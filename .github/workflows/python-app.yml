name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -e .
    - name: Lint with flake8
      run: |
        flake8 src tests run.py run_gui.py run_terrain.py run_tests.py verify.py examples --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests run.py run_gui.py run_terrain.py run_tests.py verify.py examples --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run tests
      run: python run_tests.py
