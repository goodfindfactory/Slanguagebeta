[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slanguageos"
version = "0.1.0"
description = "SlanguageOS mode-based runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
slanguage = "slanguage.cli.main:main"
slanguage-gui = "slanguage.gui.app:launch_gui"
slanguage-terrain = "slanguage.terrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
